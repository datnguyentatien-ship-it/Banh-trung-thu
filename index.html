<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d66a18"><link rel="manifest" href="/manifest.json"><title>🥮 Quản lý Bánh Trung Thu</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f0;color:#2d241f;font-family:system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:24px;margin:0}.sub,.muted{color:#806f64;font-size:13px}.badge{background:#fff0df;padding:8px 10px;border-radius:20px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.item{background:white;border:1px solid #efdfd0;border-radius:16px;padding:15px;box-shadow:0 5px 18px #5b30120d}.label{font-size:13px;color:#806f64}.num{font-size:29px;font-weight:800}.orange{color:#d66a18}.green{color:#2e8b57}.red{color:#c94a4a}nav{display:flex;gap:8px;margin:16px 0;overflow:auto}button{font:inherit;border:0;cursor:pointer;border-radius:11px;padding:10px 13px}.tab{background:#f2e9e1;color:#624e42}.tab.active,.primary{background:#d66a18;color:white}.section{display:none}.section.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar h2{font-size:19px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:6px;align-items:center}.actions button,.secondary{background:#f3ebe4;color:#604d41}.status{font-size:12px;padding:5px 8px;border-radius:20px;background:#fff1df;color:#b45b18}.done{background:#e5f7eb;color:#26734b}.empty{text-align:center;padding:30px;color:#89776c;background:white;border-radius:15px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.sheet{background:white;width:min(620px,100%);border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:12px;color:#725f54}.field input,.field select{padding:11px;border:1px solid #dfcfc1;border-radius:10px}.form-actions{text-align:right;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d241f;color:white;padding:11px 16px;border-radius:12px;display:none}.toast.show{display:block}@media(max-width:600px){.cards{gap:6px}.card{padding:11px}.num{font-size:23px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{align-items:flex-start}.actions{flex-direction:column}}
</style></head><body><div class="app">
<header><div><h1>🥮 Bánh Trung Thu</h1><div class="sub">Quản lý bán hàng dùng chung</div></div><div id="sync" class="badge">● Đang tải...</div></header>
<div class="cards"><div class="card"><div class="label">Đã bán</div><div id="sold" class="num orange">0</div></div><div class="card"><div class="label">Còn lại</div><div id="remaining" class="num green">0</div></div><div class="card"><div class="label">Đơn chưa giao</div><div id="pending" class="num red">0</div></div></div>
<nav><button class="tab active" data-tab="home">Tổng quan</button><button class="tab" data-tab="products">Loại bánh</button><button class="tab" data-tab="orders">Đơn hàng</button></nav>
<div id="home" class="section active"><div class="card"><h2>Tình hình</h2><p class="muted">Dữ liệu nằm trên máy chủ, nên mọi người mở cùng link sẽ thấy cùng một dữ liệu.</p><div id="summary"></div></div></div>
<div id="products" class="section"><div class="toolbar"><h2>Loại bánh</h2><button class="primary" onclick="openProduct()">+ Thêm bánh</button></div><div id="productList" class="list"></div></div>
<div id="orders" class="section"><div class="toolbar"><h2>Đơn hàng</h2><button class="primary" onclick="openOrder()">+ Thêm đơn</button></div><div id="orderList" class="list"></div></div></div>
<div id="modal" class="modal"><div class="sheet"><h3 id="title"></h3><div id="form"></div></div></div><div id="toast" class="toast"></div>
<script>
let db={products:[],orders:[]},edit=null;
const $=x=>document.getElementById(x);
async function api(method="GET",body){let r=await fetch("/.netlify/functions/data",{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{db=await api();render();$("sync").textContent="● Đã đồng bộ"}catch(e){$("sync").textContent="● Lỗi kết nối";toast("Không kết nối được")}}
function money(n){return new Intl.NumberFormat("vi-VN").format(n)+"đ"}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let total=db.products.reduce((s,p)=>s+ +p.stock,0),sold=db.orders.reduce((s,o)=>s+ +o.qty,0),remain=Math.max(0,total-sold),pending=db.orders.filter(o=>o.status!=="done").length;$("sold").textContent=sold;$("remaining").textContent=remain;$("pending").textContent=pending;$("summary").innerHTML=`<p>Đã nhập: <b>${total}</b> bánh</p><p>Đã bán: <b>${sold}</b> bánh</p><p>Còn lại: <b>${remain}</b> bánh</p><p>Đơn chưa giao: <b>${pending}</b></p>`;
$("productList").innerHTML=db.products.length?db.products.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">Giá ${money(p.price)} · Nhập ${p.stock}</div></div><div class="actions"><button onclick="editProduct('${p.id}')">Sửa</button><button onclick="delProduct('${p.id}')">Xóa</button></div></div>`).join(""):`<div class="empty">Chưa có loại bánh.</div>`;
$("orderList").innerHTML=db.orders.length?db.orders.slice().reverse().map(o=>`<div class="item"><div><b>${esc(o.customer)} · ${esc(o.productName)}</b><div class="muted">${o.qty} bánh · ${money(o.total)} · ${esc(o.phone||"")}</div></div><div class="actions"><span class="status ${o.status==="done"?"done":""}">${o.status==="done"?"Đã giao":"Chưa giao"}</span><button onclick="toggleOrder('${o.id}')">${o.status==="done"?"Hoàn tác":"Giao"}</button><button onclick="delOrder('${o.id}')">Xóa</button></div></div>`).join(""):`<div class="empty">Chưa có đơn hàng.</div>`}
function modal(t,h){$("title").textContent=t;$("form").innerHTML=h;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function openProduct(p=null){edit=p?.id||null;modal(p?"Sửa loại bánh":"Thêm loại bánh",`<div class="grid"><div class="field full"><label>Tên bánh</label><input id="pn" value="${esc(p?.name||"")}"></div><div class="field"><label>Giá</label><input id="pp" type="number" value="${p?.price||""}"></div><div class="field"><label>Số lượng nhập</label><input id="ps" type="number" value="${p?.stock||""}"></div></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Hủy</button> <button class="primary" onclick="saveProduct()">Lưu</button></div>`)}
async function saveProduct(){let name=$("pn").value.trim(),price=+$("pp").value,stock=+$("ps").value;if(!name||stock<0)return toast("Nhập đủ thông tin");await save({kind:"product",data:{id:edit||crypto.randomUUID(),name,price,stock}})}
function editProduct(id){openProduct(db.products.find(p=>p.id===id))}async function delProduct(id){if(confirm("Xóa loại bánh?"))await mutate("deleteProduct",{id})}
function openOrder(){if(!db.products.length)return toast("Hãy thêm loại bánh trước");modal("Thêm đơn hàng",`<div class="grid"><div class="field"><label>Tên khách</label><input id="oc"></div><div class="field"><label>Số điện thoại</label><input id="op"></div><div class="field full"><label>Loại bánh</label><select id="ob">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join("")}</select></div><div class="field"><label>Số lượng</label><input id="oq" type="number" min="1" value="1"></div></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Hủy</button> <button class="primary" onclick="saveOrder()">Lưu đơn</button></div>`)}
async function saveOrder(){let p=db.products.find(x=>x.id===$("ob").value),q=+$("oq").value;if(!$("oc").value.trim()||q<1)return toast("Nhập tên khách và số lượng");let sold=db.orders.filter(o=>o.productId===p.id).reduce((s,o)=>s+ +o.qty,0);if(sold+q>p.stock)return toast("Vượt số lượng tồn");await save({kind:"order",data:{id:crypto.randomUUID(),customer:$("oc").value.trim(),phone:$("op").value.trim(),productId:p.id,productName:p.name,qty:q,total:q*p.price,status:"pending"}})}
async function toggleOrder(id){await mutate("toggleOrder",{id})}async function delOrder(id){if(confirm("Xóa đơn?"))await mutate("deleteOrder",{id})}
async function save(x){try{db=await api("POST",x);closeModal();render();toast("Đã lưu chung")}catch(e){toast("Lưu thất bại")}}async function mutate(kind,data){try{db=await api("POST",{kind,data});render();toast("Đã cập nhật")}catch(e){toast("Cập nhật thất bại")}}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));$(b.dataset.tab).classList.add("active")});
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};load();setInterval(load,30000);
</script></body></html>
