<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f2d22"><meta name="mobile-web-app-capable" content="yes">
<title>Bánh Trung Thu</title>
<style>
:root{--red:#8d3025;--red2:#b64b35;--cream:#fff9f0;--ink:#34231d;--muted:#806f64;--gold:#d6a64f;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff9f0 0,#f7eee4 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(135deg,#76261f,#a9422f);color:#fff;padding:20px 18px 28px;border-radius:0 0 28px 28px;box-shadow:0 8px 25px #5c211d22}
header h1{margin:0;font-size:24px}header p{margin:5px 0 0;opacity:.82;font-size:13px}
main{max-width:900px;margin:auto;padding:14px 15px 100px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-8px}
.card{background:var(--card);border:1px solid #f0e1d2;border-radius:18px;box-shadow:0 6px 20px #6b32130c}.stat{padding:14px 10px}.stat .ico{font-size:20px}.stat b{display:block;font-size:25px;margin:4px 0}.stat small{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800;font-size:14px}.primary{background:var(--red);color:#fff}.soft{background:#f1e2d3;color:#713127}
.section{padding:16px;margin-bottom:12px}.section h2{font-size:18px;margin:0 0 12px}.list{display:grid;gap:9px}.item{padding:13px;border:1px solid #f0e4d9;border-radius:14px;background:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:13px}.price{font-weight:800;color:var(--red)}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#f7eadb;color:#744035}.empty{text-align:center;color:var(--muted);padding:25px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadfd4;display:flex;justify-content:center;gap:3px;padding:8px 4px;z-index:9}nav button{background:none;border:0;padding:8px 12px;border-radius:11px;color:#78665d;font-size:12px}nav button.active{background:#f3e3d4;color:var(--red);font-weight:800}
input,select,textarea{width:100%;padding:12px;border:1px solid #dfd1c5;border-radius:11px;background:#fff;font:inherit}label{font-size:12px;font-weight:800;display:block;margin:9px 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:18px}.modal>div{max-width:650px;margin:25px auto;padding:18px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:34px;height:34px;border:0;border-radius:9px;background:#f1e2d3;font-size:18px}.total{font-size:20px;font-weight:900;margin:15px 0}
@media(max-width:600px){.stat b{font-size:21px}.stats{gap:6px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🥮 Bánh Trung Thu</h1><p>Quản lý đơn hàng · tồn kho · khách hàng</p></header>
<main>
<section id="home">
<div class="stats">
<div class="card stat"><span class="ico">🥮</span><b id="sold">0</b><small>Bánh đã bán</small></div>
<div class="card stat"><span class="ico">📦</span><b id="stock">0</b><small>Bánh còn lại</small></div>
<div class="card stat"><span class="ico">🚚</span><b id="pending">0</b><small>Đơn chưa giao</small></div>
</div>
<div class="actions"><button class="btn primary" onclick="openOrder()">＋ Tạo đơn hàng</button><button class="btn soft" onclick="show('products')">🥮 Quản lý bánh</button></div>
<div class="card section"><h2>Đơn gần đây</h2><div id="recent" class="list"></div></div>
</section>
<section id="orders" class="hidden"><div class="row"><h2>Đơn hàng</h2><button class="btn primary" onclick="openOrder()">＋ Tạo đơn</button></div><input id="search" placeholder="Tìm mã đơn, khách, số điện thoại..." oninput="render()"><div id="ordersList" class="list" style="margin-top:10px"></div></section>
<section id="products" class="hidden"><div class="row"><h2>Sản phẩm</h2><button class="btn primary" onclick="productForm()">＋ Thêm</button></div><div id="productsList" class="list"></div></section>
<section id="customers" class="hidden"><h2>Khách hàng</h2><input id="csearch" placeholder="Tìm tên hoặc số điện thoại..." oninput="render()"><div id="customersList" class="list" style="margin-top:10px"></div></section>
</main>
<nav><button class="active" id="n-home" onclick="show('home')">⌂<br>Trang chủ</button><button id="n-orders" onclick="show('orders')">🧾<br>Đơn hàng</button><button id="n-products" onclick="show('products')">🥮<br>Sản phẩm</button><button id="n-customers" onclick="show('customers')">👤<br>Khách hàng</button></nav>
<div id="modal" class="modal hidden"><div class="card"><div class="row"><h2 id="mt"></h2><button class="btn soft" onclick="closeM()">Đóng</button></div><div id="mb"></div></div></div>
<script>
let db={products:[],customers:[],orders:[]};let cart={};const API='/api/data';
async function load(){try{let r=await fetch(API);if(!r.ok)throw 0;db=await r.json()}catch(e){db=JSON.parse(localStorage.getItem('fallback-v3')||'{"products":[{"id":1,"name":"Bánh thập cẩm trứng muối","filling":"Thập cẩm","weight":"200g","price":120000,"stock":30},{"id":2,"name":"Bánh đậu xanh","filling":"Đậu xanh","weight":"200g","price":90000,"stock":25},{"id":3,"name":"Bánh sen trứng muối","filling":"Hạt sen","weight":"200g","price":110000,"stock":20}],"customers":[],"orders":[]}')}}render()}
async function save(){localStorage.setItem('fallback-v3',JSON.stringify(db));try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)})}catch(e){}render()}
function money(n){return (+n).toLocaleString('vi-VN')+'đ'}function show(id){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');render()}
function render(){let sold=db.orders.filter(o=>o.delivery!=='Đã hủy').reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0);soldEl.textContent=sold;stockEl.textContent=db.products.reduce((s,p)=>s+p.stock,0);pendingEl.textContent=db.orders.filter(o=>o.delivery==='Chưa giao'||o.delivery==='Đang giao').length;
let recent=[...db.orders].reverse().slice(0,5);document.getElementById('recent').innerHTML=recent.length?recent.map(orderHTML).join(''):'<div class="empty">Chưa có đơn hàng.</div>';
let q=(document.getElementById('search')?.value||'').toLowerCase();let os=db.orders.filter(o=>(o.code+' '+o.customer+' '+o.phone).toLowerCase().includes(q)).reverse();document.getElementById('ordersList').innerHTML=os.length?os.map(orderHTML).join(''):'<div class="empty">Chưa có đơn hàng.</div>';
document.getElementById('productsList').innerHTML=db.products.map(p=>`<div class="item"><div class="row"><div><b>${p.name}</b><div class="muted">${p.filling} · ${p.weight}</div></div><b class="price">${money(p.price)}</b></div><div class="row" style="margin-top:9px"><span>Tồn: <b>${p.stock}</b></span><button class="btn soft" onclick="productForm(${p.id})">Sửa</button></div></div>`).join('');
let cq=(document.getElementById('csearch')?.value||'').toLowerCase();let cs=db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(cq));document.getElementById('customersList').innerHTML=cs.length?cs.map(c=>`<div class="item"><b>${c.name}</b><div class="muted">${c.phone||''}</div><div>${c.address||''}</div></div>`).join(''):'<div class="empty">Chưa có khách hàng.</div>'}
const soldEl=document.getElementById('sold'),stockEl=document.getElementById('stock'),pendingEl=document.getElementById('pending');
function orderHTML(o){return `<div class="item" onclick="viewOrder(${o.id})"><div class="row"><b>${o.code}</b><b class="price">${money(o.total)}</b></div><div>${o.customer}</div><div class="muted">${o.items.reduce((s,i)=>s+i.qty,0)} bánh · ${o.phone||''}</div><span class="badge">${o.delivery}</span> <span class="badge">${o.payment}</span></div>`}
function openM(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}
function productForm(id){let p=db.products.find(x=>x.id===id)||{name:'',filling:'',weight:'200g',price:'',stock:''};openM(id?'Sửa sản phẩm':'Thêm sản phẩm',`<label>Tên bánh</label><input id="pn" value="${p.name}"><div class="grid2"><div><label>Loại nhân</label><input id="pf" value="${p.filling}"></div><div><label>Khối lượng</label><input id="pw" value="${p.weight}"></div></div><div class="grid2"><div><label>Giá bán</label><input id="pp" type="number" value="${p.price}"></div><div><label>Số lượng tồn</label><input id="ps" type="number" value="${p.stock}"></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveProduct(${id||0})">Lưu</button>`)}
function saveProduct(id){let d={name:pn.value.trim(),filling:pf.value.trim(),weight:pw.value.trim(),price:+pp.value||0,stock:+ps.value||0};if(!d.name||d.price<0||d.stock<0)return alert('Kiểm tra thông tin.');if(id)Object.assign(db.products.find(p=>p.id===id),d);else db.products.push({id:Date.now(),...d});closeM();save()}
function openOrder(){cart={};let rows=db.products.map(p=>`<div class="item"><div class="row"><div><b>${p.name}</b><div class="muted">${p.weight} · còn ${p.stock} · ${money(p.price)}</div></div><div class="qty"><button onclick="qty(${p.id},-1)">−</button><b id="q${p.id}">0</b><button onclick="qty(${p.id},1)">+</button></div></div></div>`).join('');openM('Tạo đơn hàng',`<label>Tên khách hàng</label><input id="cn" placeholder="Nguyễn Văn A"><div class="grid2"><div><label>Số điện thoại</label><input id="cp"></div><div><label>Địa chỉ</label><input id="ca"></div></div><h3>Chọn bánh</h3><div class="list">${rows}</div><label>Giảm giá</label><input id="disc" type="number" value="0" oninput="total()"><label>Đã cọc / đã thanh toán</label><input id="paid" type="number" value="0"><div class="total">Tổng: <span id="grand">0đ</span></div><button class="btn primary" style="width:100%" onclick="createOrder()">Xác nhận đơn</button>`)}
function qty(id,d){let p=db.products.find(x=>x.id===id),v=(cart[id]||0)+d;v=Math.max(0,Math.min(v,p.stock));cart[id]=v;document.getElementById('q'+id).textContent=v;total()}
function total(){let t=Object.entries(cart).reduce((s,[id,q])=>s+db.products.find(p=>p.id==id).price*q,0);grand.textContent=money(Math.max(0,t-(+disc.value||0)))}
async function createOrder(){let items=Object.entries(cart).filter(x=>x[1]>0).map(([id,q])=>{let p=db.products.find(p=>p.id==id);return{productId:p.id,name:p.name,qty:q,price:p.price}});if(!items.length)return alert('Chọn ít nhất 1 bánh.');let sub=items.reduce((s,i)=>s+i.qty*i.price,0),discount=+disc.value||0,total=Math.max(0,sub-discount),paid=Math.min(+paid.value||0,total);items.forEach(i=>db.products.find(p=>p.id===i.productId).stock-=i.qty);let phone=cp.value.trim(),c=db.customers.find(x=>phone&&x.phone===phone);if(!c&&phone){c={id:Date.now(),name:cn.value.trim()||'Khách lẻ',phone,address:ca.value.trim()};db.customers.push(c)}db.orders.push({id:Date.now(),code:'DH'+String(db.orders.length+1).padStart(4,'0'),customerId:c?.id||null,customer:cn.value.trim()||'Khách lẻ',phone,address:ca.value.trim(),items,subtotal:sub,discount,total,paid,payment:paid>=total?'Đã thanh toán':paid>0?'Đã cọc':'Chưa thanh toán',delivery:'Chưa giao',createdAt:new Date().toISOString()});closeM();await save();show('orders')}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);openM(o.code,`<b>${o.customer}</b><div class="muted">${o.phone||''}</div><div>${o.address||''}</div><h3>Sản phẩm</h3>${o.items.map(i=>`<div class="row"><span>${i.name} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<hr><div class="row"><b>Tổng</b><b class="price">${money(o.total)}</b></div><p>Đã thanh toán: <b>${money(o.paid)}</b></p><label>Giao hàng</label><select id="ds"><option>Chưa giao</option><option>Đang giao</option><option>Đã giao</option><option>Đã hủy</option></select><label>Thanh toán</label><select id="psel"><option>Chưa thanh toán</option><option>Đã cọc</option><option>Đã thanh toán</option></select><button class="btn primary" style="width:100%;margin-top:12px" onclick="updateOrder(${id})">Lưu thay đổi</button>`);ds.value=o.delivery;psel.value=o.payment}
function updateOrder(id){let o=db.orders.find(x=>x.id===id),old=o.delivery,n=ds.value;if(old!=='Đã hủy'&&n==='Đã hủy')o.items.forEach(i=>db.products.find(p=>p.id===i.productId).stock+=i.qty);if(old==='Đã hủy'&&n!=='Đã hủy'){for(let i of o.items){let p=db.products.find(p=>p.id===i.productId);if(p.stock<i.qty)return alert('Không đủ tồn kho.')}o.items.forEach(i=>db.products.find(p=>p.id===i.productId).stock-=i.qty)}o.delivery=n;o.payment=psel.value;closeM();save()}
load();
</script>
</body></html>
